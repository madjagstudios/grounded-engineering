summary: A plugin whose skills build a knowledge graph of a codebase with a dashboard to browse it. You can ask questions, explain a file, check what a diff touches and generate an onboarding guide from the graph.
watch_out_for: The first /understand run on a large repo can use a lot of tokens. Its hooks do nothing until you enable --auto-update, after which they tell the agent to refresh the graph after commits and at session start without asking.
install: "/plugin marketplace add Egonex-AI/Understand-Anything, then /plugin install understand-anything"
