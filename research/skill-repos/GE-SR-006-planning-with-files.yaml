summary: Keeps a long task's plan, findings and progress in markdown files and re-injects them through hooks, so the agent can pick the task back up after /clear or context compaction.
watch_out_for: Hooks fire on every prompt and before most tool calls, and an optional gated mode can keep the agent from stopping until every phase is marked complete.
