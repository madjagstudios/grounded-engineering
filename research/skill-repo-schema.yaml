$schema: https://json-schema.org/draft/2020-12/schema
$id: https://grounded.engineering/schema/skill-repo/1.0.0
title: Grounded Engineering skill-repo record
description: A reviewed pointer to a third-party skill repository. Metadata and links only.
type: object
additionalProperties: false
required: [record_type, schema_version, id, name, repo, license, pinned_commit, reviewed_on, status, best_for, tags, summary, watch_out_for, install, install_note]
properties:
  record_type: { const: skill_repo }
  schema_version: { const: 1.0.0 }
  id: { type: string, pattern: '^GE-SR-[0-9]{3}$' }
  name: { type: string, minLength: 1, maxLength: 60 }
  repo: { type: string, pattern: '^[A-Za-z0-9][A-Za-z0-9-]*/[A-Za-z0-9._-]+$' }
  license: { type: string }
  pinned_commit: { type: string, pattern: '^[0-9a-f]{40}$' }
  reviewed_on: { type: string, pattern: '^[0-9]{4}-[0-9]{2}-[0-9]{2}$' }
  status: { enum: [listed, needs_review, delisted] }
  status_reason: { type: [string, 'null'] }
  best_for:
    type: array
    minItems: 1
    uniqueItems: true
    items: { enum: [AI_ASSISTED, TRADITIONAL, ONBOARDING, REPOSITORY_GOVERNANCE, PUBLICATION] }
  tags:
    type: array
    minItems: 1
    maxItems: 4
    uniqueItems: true
    items: { enum: [planning, testing, review, debugging, docs, frontend, typescript, python, devops, security, data, writing, design] }
  summary: { type: string, minLength: 20, maxLength: 240 }
  watch_out_for: { type: string, minLength: 10, maxLength: 240 }
  # Literal commands, run or typed in order. A step starting with / is a slash command the
  # user types; any other step is one shell command. Each step is further checked by
  # loadSkillRepos in src/lib/skill-repos.mjs.
  install:
    type: array
    minItems: 1
    maxItems: 4
    items: { type: string, minLength: 1, maxLength: 160, pattern: '^[^\r\n]*$' }
  # Plain-language context for the steps: prerequisites, alternatives, per-repo setup. Never run.
  install_note: { type: [string, 'null'], minLength: 10, maxLength: 200 }
  # A maintainer's pick: listed first under Fit and labelled Featured in the pane.
  featured: { type: boolean }
allOf:
  - if: { properties: { status: { const: delisted } }, required: [status] }
    then:
      required: [status_reason]
      properties: { status_reason: { type: string, minLength: 10 } }
  - if: { properties: { status: { const: listed } }, required: [status] }
    then:
      properties:
        # SPDX validity is checked by loadSkillRepos in src/lib/skill-repos.mjs.
        license: { type: string, minLength: 1 }
