name: Validate

on:
  # main after a merge, and PRs; a branch push without a PR runs nothing.
  push:
    branches: [main]
  pull_request:
    # ready_for_review runs the first full validation after a draft's review.
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # A new PR revision cancels the PR's previous run; main and manual runs never share a group.
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || format('run-{0}', github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  validate:
    # Drafts are reviewed with a local `npm test`; hosted validation runs once the PR is ready.
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # Pinned to a patched release; see .node-version.
          node-version-file: .node-version
          cache: npm
      - name: Check the Node version
        shell: bash
        run: |
          node --version
          npm --version
          test "$(node --version)" = "v$(cat .node-version)"
      - run: npm ci
      - run: npm test
      - name: Prepare a Claude home
        run: mkdir -p "$RUNNER_TEMP/claude-home"
      # The Claude steps share one env block (the anchor below). runner.temp is not available in
      # job-level env, and a job-level timeout would cover the whole job, not each step.
      - name: Validate marketplace
        run: npx -y @anthropic-ai/claude-code@2.1.288 plugin validate .
        timeout-minutes: 5
        env: &claude-env
          HOME: ${{ runner.temp }}/claude-home
          DISABLE_AUTOUPDATER: 1
          CLAUDE_CODE_DISABLE_NONESSENTIAL_TRAFFIC: 1
      - name: Validate plugin
        shell: bash
        run: npx -y @anthropic-ai/claude-code@2.1.288 plugin validate plugin 2>&1 | node scripts/check-plugin-calls.mjs
        timeout-minutes: 5
        env: *claude-env
      - name: Test plugin
        run: npx -y @anthropic-ai/claude-code@2.1.288 plugin test plugin
        timeout-minutes: 5
        env: *claude-env
