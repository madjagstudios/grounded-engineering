name: Upstream watch

# Weekly: compares pinned card sources and listed skill repositories with their
# upstream heads, and keeps one `upstream-drift` issue up to date. A manual run
# with dry_run prints what it would do to the issue and changes nothing.
on:
  schedule:
    - cron: '17 13 * * 1'
  workflow_dispatch:
    inputs:
      dry_run:
        description: Print what would change in the issue, without changing it
        type: boolean
        default: false

permissions:
  contents: read
  issues: write

concurrency:
  group: upstream-watch
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # Pinned to a patched release; see .node-version.
          node-version-file: .node-version
          cache: npm
      - name: Check the Node version
        shell: bash
        run: |
          node --version
          npm --version
          test "$(node --version)" = "v$(cat .node-version)"
      - run: npm ci
      - name: Check upstream and update the issue
        run: node scripts/upstream-watch.mjs
        env:
          GITHUB_TOKEN: ${{ github.token }}
          UPSTREAM_WATCH_DRY_RUN: ${{ inputs.dry_run }}
